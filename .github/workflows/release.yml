name: Build and publish release

# Push a version tag and this builds the installable zip and publishes it as a
# release asset. That asset is what every site downloads, so nothing about the
# update path depends on a human remembering to attach the right file.
#
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: inmx-buy-more-save-more

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}"                >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"          >> "$GITHUB_OUTPUT"

      # An installed plugin reports the version in its own header, not the tag.
      # If the two disagree, WordPress installs the update, still reads the old
      # number, and offers the same update again on every single check, forever.
      # Failing the build here is much cheaper than shipping that loop to nine
      # live stores.
      - name: Verify plugin header matches the tag
        run: |
          HEADER=$(grep -m1 '^ \* Version:' "${SLUG}.php" | awk '{print $3}')
          CONST=$(grep -m1 "define( 'INMX_BMSM_VERSION'" "${SLUG}.php" | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          echo "tag=${{ steps.version.outputs.version }}  header=${HEADER}  constant=${CONST}"
          if [ "$HEADER" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Plugin header version '${HEADER}' does not match tag '${{ steps.version.outputs.version }}'."
            exit 1
          fi
          if [ "$CONST" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::INMX_BMSM_VERSION '${CONST}' does not match tag '${{ steps.version.outputs.version }}'."
            exit 1
          fi

      - name: Lint PHP
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find . -name '*.php' -not -path './.git/*')
          exit $fail

      - name: Build the installable zip
        run: |
          mkdir -p build/${SLUG}
          rsync -a ./ build/${SLUG} \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.distignore' \
            --exclude 'build' \
            --exclude 'docs' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.md' \
            --exclude '.DS_Store'
          cd build && zip -rq "../${SLUG}.zip" "${SLUG}" -x '*.DS_Store'
          cd .. && unzip -l "${SLUG}.zip" | head -30

      # Proves the archive unpacks to the folder name WordPress expects. A zip
      # whose root folder is wrong installs as a second copy of the plugin
      # instead of updating the existing one.
      - name: Verify zip structure
        run: |
          ROOT=$(unzip -Z1 "${SLUG}.zip" | head -1 | cut -d/ -f1)
          test "$ROOT" = "$SLUG" || { echo "::error::zip root is '$ROOT', expected '$SLUG'"; exit 1; }
          unzip -l "${SLUG}.zip" | grep -q "${SLUG}/${SLUG}.php" || { echo "::error::main plugin file missing from zip"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.SLUG }}.zip
